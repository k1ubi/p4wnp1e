# Pi4B PORT - install to /etc/NetworkManager/conf.d/10-p4wnp1-unmanaged.conf
#
# Why this exists
# ================
# The original Pi0W images (Kali, and the pre-Bookworm Raspbian releases they
# were forked from) used dhcpcd, and the Makefile's `installkali` target just
# turned off the pieces that would fight with P4wnP1:
#
#   systemctl disable networking.service
#
# Raspberry Pi OS Bookworm (our Pi4B base image) switched the default network
# stack to NetworkManager. P4wnP1 fully owns and hand-configures several
# interfaces itself (service/SubSysNetworkManager.go, service/wifi.go,
# service/SubSysUSB.go):
#
#   - wlan0        hostapd / wpa_supplicant + its own dnsmasq, run as
#                  subprocesses directly - NOT via NetworkManager's own
#                  built-in Wi-Fi AP or wpa_supplicant instance.
#   - usb0, usb1   RNDIS / CDC-ECM gadget functions, created dynamically by
#                  the configfs gadget when deployed.
#   - usbeth       the bridge P4wnP1 creates over usb0+usb1 (SubSysUSB.go's
#                  addUSBEthernetBridge()).
#   - bnep*        Bluetooth PAN interfaces via mblue-toolz/BlueZ.
#
# If NetworkManager also tries to manage these (assigning its own DHCP
# client, auto-connecting, resetting addresses/MTU set via configfs, or simply
# racing P4wnP1's own dnsmasq for interface ownership), you get flaky
# behaviour that looks like "P4wnP1 network settings don't stick" - the
# actual cause is two DHCP servers/clients fighting over the same interface.
#
# This does NOT disable NetworkManager wholesale (unlike the old
# `systemctl disable networking.service` approach) so a physical eth0 (if
# present) or a wifi adapter used for something other than P4wnP1's own AP
# still gets normal DHCP/NM convenience. Only the interfaces P4wnP1 owns are
# excluded.
#
# Interface names are matched as soon as they appear (udev add event), so this
# works fine even though usb0/usb1/usbeth only exist after the gadget is
# deployed at runtime, not at boot.

[keyfile]
unmanaged-devices=interface-name:wlan0;interface-name:usb0;interface-name:usb1;interface-name:usbeth;interface-name:bnep*;interface-name:br-usb

# If you'd rather replicate the old Kali image's "P4wnP1 owns literally
# everything, NetworkManager only handles eth0 if at all" behaviour, comment
# out the [keyfile] section above and instead run:
#   systemctl disable --now NetworkManager-wait-online.service
#   systemctl mask NetworkManager
# and manage eth0 yourself (or via systemd-networkd with a trivial
# DHCP-on-eth0 .network file). Not needed for the default P4wnP1 feature set.
